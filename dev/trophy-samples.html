<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>トロフィーの見本</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Noto+Sans+JP:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="../style.css">
  <style>
    /* 開発用の見本ページ（トロフィーの案を選んだら消す） */
    body { padding: 16px; font-size: 13px; }
    h1 { font-size: 15px; font-weight: 500; margin: 0 0 4px; }
    .lead { color: var(--text-muted); margin: 0 0 16px; font-size: 12px; }
    .design { margin-bottom: 20px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
    .design h2 { font-size: 13px; font-weight: 500; margin: 0 0 10px; color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 4px; }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .big { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 8px; background: var(--bg); }
    .small { height: 26px; display: grid; place-items: center; }
    .name { font-size: 10px; color: var(--text-muted); text-align: center; }
  </style>
</head>
<body>
  <h1>トロフィーの形（3案）</h1>
  <p class="lead">上は拡大（48px）、下はナビ画面の隅と同じ大きさ（26px）。左上は「アイアン前」</p>
  <div id="designs"></div>
  <script type="module">
    import { TROPHY_DESIGNS, createTrophyIcon } from "../src/trophy-icons.js";
    import { TROPHY_LEVELS } from "../src/config.js";
    const levels = [{ id: null, name: "アイアン前", count: 0 }, ...TROPHY_LEVELS];
    const root = document.getElementById("designs");
    for (const [id, design] of Object.entries(TROPHY_DESIGNS)) {
      const box = document.createElement("section");
      box.className = "design";
      box.id = `design-${id}`;
      const h = document.createElement("h2");
      h.textContent = design.label;
      const grid = document.createElement("div");
      grid.className = "grid";
      for (const l of levels) {
        const cell = document.createElement("div");
        cell.className = "cell";
        const big = document.createElement("div");
        big.className = "big";
        big.append(createTrophyIcon(document, l.id, id, 48));
        const small = document.createElement("div");
        small.className = "small";
        small.append(createTrophyIcon(document, l.id, id, 26));
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = l.id ? `${l.name}（${l.count}回）` : l.name;
        cell.append(big, small, name);
        grid.append(cell);
      }
      box.append(h, grid);
      root.append(box);
    }
  </script>
</body>
</html>
